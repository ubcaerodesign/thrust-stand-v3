name: Release AeroThrust V3

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.1, v1.0.2, etc.
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

# Explicitly grant write permissions to publish releases and upload assets
permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Builder (x86_64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            backend_binary: aerothrust-backend-x86_64-pc-windows-msvc.exe
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --clean --name "aerothrust-backend" backend/run.py
            output_binary_src: dist/aerothrust-backend.exe

          # macOS Apple Silicon Builder (M1/M2/M3/M4 - aarch64)
          - os: macos-latest
            target: aarch64-apple-darwin
            backend_binary: aerothrust-backend-aarch64-apple-darwin
            pyinstaller_cmd: pyinstaller --noconfirm --onefile --clean --name "aerothrust-backend" backend/run.py
            output_binary_src: dist/aerothrust-backend

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Freeze Python Backend (Sidecar)
        run: ${{ matrix.pyinstaller_cmd }}

      - name: Stage Sidecar Binary for Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp ${{ matrix.output_binary_src }} frontend/src-tauri/binaries/${{ matrix.backend_binary }}
          chmod +x frontend/src-tauri/binaries/*

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Desktop Application & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: ${{ github.ref_name }}
          releaseName: 'AeroThrust V3 ${{ github.ref_name }}'
          releaseBody: 'Automated release build generated by GitHub Actions CI/CD.'
          releaseDraft: false
          prerelease: false